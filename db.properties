# ====================================================================
# HOSTEL MANAGEMENT SYSTEM - DATABASE & MULTI-DEVICE ENCRYPTED SERVER CONFIG
# ====================================================================

# MySQL Connection Details
db.url=jdbc:mysql://localhost:3306/hostel_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root

# Server Port (Workable on ANY port: 8443, 8080, 9090, 3000, or 0 for dynamic)
# You can also override this by running: java -cp "bin;lib/*" com.hostel.Main <PORT>
server.port=8443

# Multi-Device End-to-End TLS Encryption (HTTPS)
server.ssl.enabled=true
server.ssl.keystore=config/keystore.p12
server.ssl.password=hostelpass123

# In-Memory Resilience Fallback (Ensures 100% Viva Uptime if MySQL is stopped)
db.enable.mock.fallback=true
